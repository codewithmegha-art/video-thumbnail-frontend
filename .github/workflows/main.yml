name: Frontend CI/CD Pipeline

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: frontend-app

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 📥 Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 🟢 Setup Node.js
      - name: Setup node js
        uses: actions/setup-node@v4

      # 📦 Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 🏗️ Build React app
      - name: Build React app
        run: npm run build

      # 🔐 Gitleaks scan
      - name: Run Gitleaks scan
        run: gitleaks detect --source . --no-git

      # 🐳 Docker login
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🐳 Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.sha }} .

      # 🔍 Trivy scan
      - name: Scan Docker image
        run: trivy image --scanners vuln ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.sha }}

      # 🚀 Push image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.sha }}

      # ☸️ Set kubeconfig
      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      # 🔄 Update image in deployment.yaml
      - name: Update Deployment Image
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.sha }}|g" k8s/deployment.yaml

      # 🚀 Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      # ✅ Verify deployment
      - name: Verify
        run: |
          kubectl get pods
          kubectl get svc
          kubectl get ingress
           
           
         

        

       
       

           

       

        
         
