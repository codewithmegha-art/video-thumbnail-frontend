name: Frntend CI/CD Pipeline

on: 
  push: 
    branches: ['main']

jobs:
  build:
     runs-on: self-hosted

     steps:
     # Checkout code
       - name: Checkout code
         uses: actions/checkout@v4

        # Setup node js
       - name: Setup node js
         uses: actions/setup-node@v4

      # install dependancies
       - name: Install Dependencies
         run: npm ci 

    # Build react app
       - name: Build React app
         run : npm run build 

    # Gitleaks
       - name: Run Gitleaks scan
         run : gitleaks detect --source . --no-git

    # Sonarqube
       - name : Sonarqube analysis
         run : |
           docker run --rm \
           -e SONAR_HOST_URL="${{ vars.SONAR_HOST_URL }}" \
           -e SONAR_LOGIN="${{ secrets.SONAR_TOKEN }}" \
           -v "${{ github.workspace }}:/usr/src" \
           sonarsource/sonar-scanner-cli

    # docker login
       - name: Docker login
         run : echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME}}" --password-stdin

    # Build Image
       - name: Build Docker image
         run:  docker build -t "${{secrets.DOCKER_USERNAME}}/frontend-app:latest" . 

    # Scan the docker image
       - name : Sonar Docker Image
         run : trivy image --scanners vuln "${{ secrets.DOCKER_USERNAME }}/frontend-app:latest" 

    # Push image
       - name: Push Docker Image
         run : docker push "${{ secrets.DOCKER_USERNAME }}/frontend-app:latest"

        

       
       

           

       

        
         
